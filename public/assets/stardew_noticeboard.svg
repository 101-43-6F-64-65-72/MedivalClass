<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="nbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <rect x="2" y="4" width="60" height="58" rx="2" fill="#000000" opacity="0.3" filter="url(#nbShadow)"/>

  <!-- Heavy Oak Wooden Board Frame -->
  <rect x="4" y="2" width="56" height="58" fill="#5a3112" stroke="#2b1404" stroke-width="2" rx="2"/>
  <!-- Corkboard Interior -->
  <rect x="8" y="6" width="48" height="50" fill="#c49a62" stroke="#2b1404" stroke-width="1"/>
  <!-- Cork texture dots -->
  <circle cx="14" cy="12" r="1" fill="#9e733e" opacity="0.6"/>
  <circle cx="28" cy="18" r="1.2" fill="#9e733e" opacity="0.6"/>
  <circle cx="44" cy="10" r="1" fill="#9e733e" opacity="0.6"/>
  <circle cx="18" cy="38" r="1" fill="#9e733e" opacity="0.6"/>
  <circle cx="36" cy="46" r="1.2" fill="#9e733e" opacity="0.6"/>
  <circle cx="48" cy="34" r="1" fill="#9e733e" opacity="0.6"/>

  <!-- Pinned Paper 1 (Class Schedule: Top Left) -->
  <g transform="translate(11, 10)">
    <rect x="0" y="0" width="16" height="20" fill="#fefae0" stroke="#78350f" stroke-width="0.8" rx="0.5"/>
    <!-- Red Pushpin -->
    <circle cx="8" cy="2" r="1.8" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.5"/>
    <!-- Pencil notes -->
    <line x1="3" y1="6" x2="13" y2="6" stroke="#92400e" stroke-width="0.8"/>
    <line x1="3" y1="9" x2="13" y2="9" stroke="#92400e" stroke-width="0.8"/>
    <line x1="3" y1="12" x2="10" y2="12" stroke="#92400e" stroke-width="0.8"/>
    <line x1="3" y1="15" x2="12" y2="15" stroke="#92400e" stroke-width="0.8"/>
  </g>

  <!-- Pinned Paper 2 (Gold Star Announcement: Top Right) -->
  <g transform="translate(32, 9) rotate(6)">
    <rect x="0" y="0" width="18" height="18" fill="#fef3c7" stroke="#b45309" stroke-width="0.8" rx="0.5"/>
    <!-- Blue Pushpin -->
    <circle cx="9" cy="2" r="1.8" fill="#3b82f6" stroke="#1e3a8a" stroke-width="0.5"/>
    <!-- Gold Star Achievement -->
    <polygon points="9,5 10.5,9 15,9 11.5,11.5 13,15.5 9,13 5,15.5 6.5,11.5 3,9 7.5,9" fill="#eab308" stroke="#78350f" stroke-width="0.5"/>
  </g>

  <!-- Pinned Paper 3 (Student Artwork / Drawing: Bottom Left) -->
  <g transform="translate(13, 34) rotate(-4)">
    <rect x="0" y="0" width="18" height="18" fill="#ffffff" stroke="#475569" stroke-width="0.8" rx="0.5"/>
    <!-- Yellow Pushpin -->
    <circle cx="9" cy="2" r="1.8" fill="#eab308" stroke="#713f12" stroke-width="0.5"/>
    <!-- Child's Crayon Drawing of a Stardew Junimo / Apple -->
    <circle cx="9" cy="10" r="5" fill="#4ade80" stroke="#15803d" stroke-width="0.8"/>
    <circle cx="7" cy="9" r="0.8" fill="#000000"/>
    <circle cx="11" cy="9" r="0.8" fill="#000000"/>
    <line x1="9" y1="5" x2="10" y2="3" stroke="#15803d" stroke-width="0.8"/>
  </g>

  <!-- Pinned Note 4 (Bottom Right sticky note) -->
  <g transform="translate(34, 32)">
    <rect x="0" y="0" width="16" height="16" fill="#fbcfe8" stroke="#9d174d" stroke-width="0.8" rx="0.5"/>
    <circle cx="8" cy="2" r="1.8" fill="#10b981" stroke="#064e3b" stroke-width="0.5"/>
    <line x1="3" y1="7" x2="13" y2="7" stroke="#831843" stroke-width="0.8"/>
    <line x1="3" y1="11" x2="11" y2="11" stroke="#831843" stroke-width="0.8"/>
  </g>
</svg>
