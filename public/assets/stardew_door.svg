<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <filter id="dShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Ground / Threshold Shadow -->
  <rect x="4" y="88" width="88" height="8" rx="2" fill="#000000" opacity="0.35" filter="url(#dShadow)"/>

  <!-- Door Outer Stone / Wood Archway Frame -->
  <rect x="6" y="4" width="84" height="86" fill="#4d2b12" stroke="#261205" stroke-width="2.5" rx="3"/>
  <!-- Top Header Molding -->
  <rect x="2" y="2" width="92" height="7" fill="#78421b" stroke="#261205" stroke-width="1.5" rx="1"/>

  <!-- Left Door Leaf (x: 10, width: 37, height: 82) -->
  <rect x="10" y="9" width="37" height="80" fill="#693b18" stroke="#261205" stroke-width="1.5"/>
  <!-- Left Upper Recessed Panel with Glass Grid -->
  <rect x="15" y="15" width="27" height="30" fill="#bae6fd" stroke="#261205" stroke-width="1.5" rx="1"/>
  <line x1="28.5" y1="15" x2="28.5" y2="45" stroke="#261205" stroke-width="1"/>
  <line x1="15" y1="30" x2="42" y2="30" stroke="#261205" stroke-width="1"/>
  <!-- Left Lower Wooden Panel -->
  <rect x="15" y="52" width="27" height="30" fill="#522b10" stroke="#261205" stroke-width="1.5" rx="1"/>
  <rect x="18" y="55" width="21" height="24" fill="#693b18"/>
  <!-- Left Brass Handle -->
  <circle cx="41" cy="52" r="2.5" fill="#facc15" stroke="#713f12" stroke-width="1"/>

  <!-- Right Door Leaf (x: 49, width: 37, height: 82) -->
  <rect x="49" y="9" width="37" height="80" fill="#693b18" stroke="#261205" stroke-width="1.5"/>
  <!-- Right Upper Recessed Panel with Glass Grid -->
  <rect x="54" y="15" width="27" height="30" fill="#bae6fd" stroke="#261205" stroke-width="1.5" rx="1"/>
  <line x1="67.5" y1="15" x2="67.5" y2="45" stroke="#261205" stroke-width="1"/>
  <line x1="54" y1="30" x2="81" y2="30" stroke="#261205" stroke-width="1"/>
  <!-- Right Lower Wooden Panel -->
  <rect x="54" y="52" width="27" height="30" fill="#522b10" stroke="#261205" stroke-width="1.5" rx="1"/>
  <rect x="57" y="55" width="21" height="24" fill="#693b18"/>
  <!-- Right Brass Handle -->
  <circle cx="55" cy="52" r="2.5" fill="#facc15" stroke="#713f12" stroke-width="1"/>

  <!-- Stone / Oak Sill Threshold at Base -->
  <rect x="4" y="88" width="88" height="6" fill="#8c5828" stroke="#261205" stroke-width="1.5" rx="1"/>
  <line x1="6" y1="89" x2="90" y2="89" stroke="#c0844e" stroke-width="1"/>
</svg>
